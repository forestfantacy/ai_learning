<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>库迪咖啡C端客服</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --border: #e2e4e9;
    --text: #1c1e21;
    --muted: #6b7280;
    --user-bubble: #2563eb;
    --user-text: #ffffff;
    --bot-bubble: #eef0f3;
    --bot-text: #1c1e21;
    --accent: #2563eb;
    --danger: #dc2626;
    --warn: #b45309;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100vh;
    height: 100dvh; /* iOS/Android address bar show/hide shrinks the real viewport - 100vh alone clips or gaps */
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    padding: max(10px, env(safe-area-inset-top)) 16px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
    white-space: nowrap;
    flex: 1;
  }
  header button {
    padding: 9px 14px;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  header button:hover { background: var(--bg); }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row { display: flex; flex-direction: column; max-width: 640px; }
  .row.user { align-self: flex-end; align-items: flex-end; }
  .row.bot { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: 15px;
  }
  .row.user .bubble { background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 4px; }
  .row.bot .bubble { background: var(--bot-bubble); color: var(--bot-text); border-bottom-left-radius: 4px; }
  .meta {
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  .badge {
    padding: 1px 7px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .02em;
  }
  .badge.answered { background: #dcfce7; color: #166534; }
  .badge.clarifying { background: #fef3c7; color: var(--warn); }
  .badge.no_match { background: #e5e7eb; color: var(--muted); }
  .badge.error { background: #fee2e2; color: var(--danger); }
  .entry-id { font-family: ui-monospace, monospace; }
  .tokens { font-family: ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .images { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .images img {
    max-width: 160px;
    max-height: 160px;
    border-radius: 8px;
    border: 1px solid var(--border);
    object-fit: cover;
  }
  .images a { font-size: 12px; }

  #composer {
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
  }
  #composer input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 16px; /* below 16px, iOS Safari auto-zooms the page on focus */
  }
  #composer button {
    padding: 12px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
  }
  #composer button:disabled { opacity: .5; cursor: default; }

  .typing { display: inline-flex; gap: 4px; padding: 2px 0; }
  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: .35;
    animation: typing-bounce 1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes typing-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: .35; }
    40% { transform: translateY(-4px); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .typing span { animation: none; opacity: .6; }
  }

  .system-note {
    align-self: center;
    font-size: 12px;
    color: var(--muted);
    background: var(--bot-bubble);
    padding: 4px 10px;
    border-radius: 999px;
  }
</style>
</head>
<body>

<header>
  <h1>库迪咖啡C端客服</h1>
  <button id="resetBtn">开始新会话</button>
</header>

<div id="log"></div>

<form id="composer">
  <input id="msgInput" type="text" placeholder="输入您的问题…" autocomplete="off" enterkeyhint="send">
  <button id="sendBtn" type="submit">发送</button>
</form>

<script>
  const logEl = document.getElementById('log');
  const inputEl = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const resetBtn = document.getElementById('resetBtn');

  let sessionId = null;

  function addNote(text) {
    const el = document.createElement('div');
    el.className = 'system-note';
    el.textContent = text;
    logEl.appendChild(el);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function addRow(role, { text }) {
    const row = document.createElement('div');
    row.className = 'row ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    logEl.appendChild(row);
    logEl.scrollTop = logEl.scrollHeight;
    return { row, bubble };
  }

  function createBotRow() {
    const row = document.createElement('div');
    row.className = 'row bot';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const typing = document.createElement('span');
    typing.className = 'typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    bubble.appendChild(typing);
    row.appendChild(bubble);
    logEl.appendChild(row);
    logEl.scrollTop = logEl.scrollHeight;
    return { row, bubble, hasStartedText: false };
  }

  function appendBotText(botRow, chunk) {
    if (!botRow.hasStartedText) {
      botRow.hasStartedText = true;
      botRow.bubble.textContent = ''; // also clears the typing indicator
    }
    botRow.bubble.textContent += chunk;
    logEl.scrollTop = logEl.scrollHeight;
  }

  function finalizeBotRow(botRow, { text, status, entryId, imageUrls, promptTokens, completionTokens }) {
    if (text !== undefined) botRow.bubble.textContent = text;

    if (imageUrls && imageUrls.length) {
      const imgs = document.createElement('div');
      imgs.className = 'images';
      imageUrls.forEach(url => {
        const a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        const img = document.createElement('img');
        img.src = url;
        img.alt = '图片';
        a.appendChild(img);
        imgs.appendChild(a);
      });
      botRow.row.appendChild(imgs);
    }

    if (status) {
      const meta = document.createElement('div');
      meta.className = 'meta';
      const badge = document.createElement('span');
      badge.className = 'badge ' + status;
      badge.textContent = status;
      meta.appendChild(badge);
      if (entryId) {
        const id = document.createElement('span');
        id.className = 'entry-id';
        id.textContent = 'entry_id: ' + entryId;
        meta.appendChild(id);
      }
      if (promptTokens !== undefined && completionTokens !== undefined) {
        const tokens = document.createElement('span');
        tokens.className = 'tokens';
        tokens.textContent = `↑${promptTokens} ↓${completionTokens} tokens`;
        meta.appendChild(tokens);
      }
      botRow.row.appendChild(meta);
    }

    logEl.scrollTop = logEl.scrollHeight;
  }

  // Parses one SSE frame ("event: x\ndata: {...}") as sent by /chat/stream.
  function parseSSEFrame(frame) {
    let event = 'message';
    const dataLines = [];
    for (const line of frame.split('\n')) {
      if (line.startsWith('event:')) event = line.slice(6).trim();
      else if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());
    }
    return { event, data: dataLines.length ? JSON.parse(dataLines.join('\n')) : null };
  }

  async function sendMessage(text) {
    addRow('user', { text });
    sendBtn.disabled = true;
    inputEl.disabled = true;
    const botRow = createBotRow();

    try {
      const res = await fetch('/chat/stream', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });

      if (!res.ok || !res.body) {
        finalizeBotRow(botRow, { text: 'HTTP ' + res.status, status: 'error' });
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let sep;
        while ((sep = buffer.indexOf('\n\n')) !== -1) {
          const frame = buffer.slice(0, sep);
          buffer = buffer.slice(sep + 2);
          if (!frame.trim()) continue;

          const { event, data } = parseSSEFrame(frame);
          if (event === 'delta') {
            appendBotText(botRow, data.text);
          } else if (event === 'done') {
            sessionId = data.session_id;
            finalizeBotRow(botRow, {
              text: data.reply,
              status: data.status,
              entryId: data.matched_entry_id,
              imageUrls: data.image_urls,
              promptTokens: data.prompt_tokens,
              completionTokens: data.completion_tokens,
            });
          } else if (event === 'error') {
            finalizeBotRow(botRow, { text: data.message, status: 'error' });
          }
        }
      }
    } catch (err) {
      finalizeBotRow(botRow, { text: '请求失败：' + err.message + '（服务在跑吗？地址对吗？）', status: 'error' });
    } finally {
      sendBtn.disabled = false;
      inputEl.disabled = false;
      inputEl.focus();
    }
  }

  document.getElementById('composer').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    sendMessage(text);
  });

  resetBtn.addEventListener('click', () => {
    sessionId = null;
    logEl.innerHTML = '';
    addNote('已开始新会话');
  });

  addNote('您好！我是库迪咖啡智能客服，有什么可以帮您？');
</script>

</body>
</html>
