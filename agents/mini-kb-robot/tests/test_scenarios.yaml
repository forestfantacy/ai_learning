# Conversational scenarios run against the real Ark API via chat.engine.
# Requires ARK_API_KEY (+ ARK_MODEL) to be set; scripts/run_scenarios.py
# skips the whole suite with a message if they're missing.
#
# Each scenario is a fresh session; turns within a scenario share one
# session_id so multi-turn clarification flows are exercised for real.

- name: crisis_self_harm_short_circuits
  description: >
    Self-harm signal must short-circuit to the fixed crisis reply without
    ever reaching the model - deterministic, no LLM judgment involved.
  turns:
    - message: "我不想活了，想跳楼"
      expect_status: escalated
      expect_escalated: true
      expect_escalation_reason: self_harm
      expect_reply_contains: ["12356"]

- name: regulatory_keyword_short_circuits
  description: >
    Regulatory/media escalation threats must short-circuit to a human-transfer
    reply grounded in the real "客服电话" entry, without model judgment.
  turns:
    - message: "你们这样我要打12315投诉"
      expect_status: escalated
      expect_escalated: true
      expect_escalation_reason: regulatory
      expect_entry_id: "09566022959"

- name: quality_complaint_reply_composed_and_escalates_on_second_hit
  description: >
    Product-quality / food-safety complaint signals inject a system note (not
    a fixed script) so the model composes a reply grounded in the given text -
    see _quality_complaint_note in chat/engine.py. First hit directs the user
    to leave a message via "+"; a second hit in the same session escalates to
    explicitly asking for photo/video evidence via the leave-message card.
  turns:
    - message: "我喝出了虫子，这也太脏了"
      expect_status: answered
      expect_escalated: false
      expect_reply_contains: ["留言"]
    - message: "卫生条件差，头发都掉进去了"
      expect_status: answered
      expect_escalated: false
      expect_reply_contains: ["留言卡片"]

- name: quality_complaint_fallback_tool_catches_a_non_keyword_phrasing
  description: >
    "我现在恶心想吐，好像是喝的东西有问题" doesn't contain any literal keyword
    in _QUALITY_COMPLAINT_PHRASES, so detect_high_risk misses it - the model
    should recognize it as a quality complaint anyway and call
    flag_complaint_category (only offered when the keyword scan came up
    empty) rather than answering no_match. See build_flag_complaint_tool /
    execute_flag_complaint_category in chat/engine.py.
  turns:
    - message: "我现在恶心想吐，好像是喝的东西有问题"
      expect_status: answered
      expect_escalated: false
      expect_reply_contains: ["留言"]

- name: attitude_complaint_reply_composed_and_escalates_on_second_hit
  description: >
    Service-attitude / harassment complaint signals inject a system note (not
    a fixed script) so the model composes a reply grounded in the given text -
    see _attitude_complaint_note in chat/engine.py. First hit apologizes
    without any call to action; a second hit in the same session must clearly
    direct the user to leave a message.
  turns:
    - message: "店员态度恶劣，还对我阴阳怪气"
      expect_status: answered
      expect_escalated: false
      expect_reply_not_contains: ["留言"]
    - message: "又摔东西又骂人，太过分了"
      expect_status: answered
      expect_escalated: false
      expect_reply_contains: ["留言"]

- name: blind_transfer_request_never_escalates_without_a_stated_problem
  description: >
    Repeating a context-free "转人工" - never explaining an actual problem -
    must never escalate, no matter how many times it's repeated. Escalation
    is earned by a genuinely unresolved, stated problem, not by keyword count.
  turns:
    - message: "转人工"
      expect_status: clarifying
      expect_escalated: false
    - message: "你解决不了，给我转"
      expect_escalated: false

- name: unresolved_problem_escalates_only_on_the_turn_after_it_first_fails
  description: >
    A genuinely unresolved problem doesn't escalate the first time it fails -
    only if the user is still unresolved on the very next turn.
  turns:
    - message: "你们卖披萨吗"
      expect_status: no_match
      expect_escalated: false
    - message: "那你们能不能进货卖披萨，我真的很想知道能不能"
      expect_status: escalated
      expect_escalated: true
      expect_escalation_reason: unresolved_after_retry

- name: risk_cluster_ambiguous_bundle_first_turn
  description: >
    Deliberately ambiguous "联名周边卖完了" must not be answered directly -
    this is the core case the whole design exists to get right.
  turns:
    - message: "联名周边卖完了"
      expect_status: clarifying

- name: risk_cluster_resolves_to_bundle_after_clarification
  turns:
    - message: "联名周边卖完了"
      expect_status: clarifying
    - message: "是那个联名套餐"
      expect_status: answered
      expect_entry_id: "2081585274477150208"
      expect_reply_contains: ["附近在售门店"]
      expect_reply_not_contains: ["加急补货", "备货中"]

- name: risk_cluster_single_item_never_returns_bundle_answer
  turns:
    - message: "联名周边卖完了"
      expect_status: clarifying
    - message: "是单独的一件周边商品"
      # May ask one more disambiguating question (buy vs redeem) or resolve
      # directly - either is acceptable, but it must never be the bundle answer.
      expect_entry_id_not_in: ["2081585274477150208"]

- name: risk_cluster_generic_product_no_clarification_needed
  turns:
    - message: "普通商品显示售罄了"
      expect_status: answered
      expect_entry_id: "63730228540"

- name: wrong_order_no_orders_found
  description: >
    User reports a wrong item/store but the (mocked) recent-orders lookup
    finds nothing - must say so plainly, not guess or ask for an order number.
  session_id: "scenario-zero-orders-0"
  turns:
    - message: "我选错商品了，能取消吗"
      expect_status: no_match

- name: wrong_order_single_order_confirms_then_cancels
  description: >
    Exactly one recent unfinished order -> confirm it, then route to
    self-service cancellation since the mock order status is not_started.
  session_id: "scenario-one-order-1"
  turns:
    - message: "我选错商品了，能取消吗"
      expect_status: clarifying
    - message: "对，就是这笔"
      expect_status: answered
      expect_entry_id: "58204917366"
      expect_reply_contains: ["取消"]

- name: wrong_order_multiple_orders_lists_then_routes_to_store_contact
  description: >
    Two recent unfinished orders -> list them, user picks the second one,
    whose mock order status is in_production -> route to store contact.
  session_id: "scenario-two-orders-2"
  turns:
    - message: "我选错门店了"
      expect_status: clarifying
    - message: "2"
      expect_status: answered
      expect_entry_id: "04135836544"
      expect_reply_contains: ["门店"]

